    retorno: "RevertResult (lodestar_app): { reverted, receiptId, previousWorkspaceRevision, workspaceRevision, changedPaths, semanticDiff } — json directo, sin envelope. Es INVERSO al apply: previousWorkspaceRevision == resultRevision del apply revertido; workspaceRevision == previousRevision del apply (estado restaurado)"
    output_schema: "sí — schemars::schema_for!(RevertResult), vía lodestar_app::schemas::change_revert_schema()"
    errores: ["INVALID_SCHEMA (parámetro no declarado — E29-H08)", "PLAN_EXPIRED (receipt no disponible: caducado/purgado por retención — reuso documentado del catálogo congelado de ErrorCode, no hay variante «receipt no encontrado»)", "REVISION_CONFLICT (expectedWorkspaceRevision no coincide con la revisión actual)", "WRITE_CONFLICT (CUATRO emisores, los cuatro antes de la primera escritura: (1) un fichero afectado —o cualquier otro— cambió tras el apply, o sea la revisión actual ya no es la resultRevision del receipt; comprobado antes de tomar el lock y RE-VERIFICADO bajo él, E25-H05; (2) el lock de publicación ya lo tiene otro publicador vivo; y los DOS BORDES de la identidad de la inversa, declarados aquí como casos extremos y no como camino ordinario: (3) el llamante pide publicar la inversa bajo la MISMA identidad que deshace (`newTxnId == origTxnId`) —no es una colisión de nombres que se resuelva moviendo el id, sino una contradicción: restauraría desde el mismo árbol de recuperación que estaría reescribiendo—, y (4) la cadena de variantes NO PUEDE AVANZAR porque el candidato es el punto fijo `u64::MAX` (`X-revert-18446744073709551615`) y ese id ya está tomado por material vigente, de modo que no queda ninguna variante libre que probar. Lo que NO es un emisor es el caso ORDINARIO de que el `txnId` derivado esté ocupado: E28-H01 lo rechazaba y E28-H03 lo retiró del camino feliz —la identidad se resuelve buscando la primera variante LIBRE, con el mismo criterio de «vivo» del GC (journal ∪ receipts), en vez de fallar sin salida—, así que republicar y volver a revertir el mismo cambio ya no deja una transacción permanentemente no revertible; solo el punto fijo agota la cadena. Los mensajes dicen qué hacer —replanificar el cambio sobre el estado actual— y NINGUNO menciona rutas internas del plano de control: ni `.lodestar`, ni `runtime/`, ni `receipts/`/`recovery/`, ni rutas absolutas de la máquina. Verificado por `lodestar-workspace/tests/transactions.rs::identidad_de_transaccion_libre`)", "PERMISSION_DENIED (un path afectado ya no es escribible)", "RECOVERY_FAILED (E25-H02, mismo caso: la reversión también recupera antes de revertir, así que hereda el fallo y la cuarentena)", "INTERNAL_IO_ERROR (carga de config, IO de la transacción, copias de recuperación ausentes)", "WorkspaceError"]
    semantica: >-
      Revierte una transacción RECIENTE y no alterada por el ÚNICO ESCRITOR (invariante #5),
      devolviendo el conocimiento canónico al estado ANTERIOR al apply desde sus copias de
      recuperación (E13-H04), como una NUEVA transacción inversa recuperable (con su propio
      write-ahead journal y copias de recuperación, invariante «nunca un estado parcial silencioso»).
      Condiciones EN ORDEN: (1) carga el ChangeReceipt persistido (E13-H07) por `receiptId` →
      PLAN_EXPIRED si no está (purgado por el GC de retención); (2) verifica
      `expectedWorkspaceRevision` si viene → REVISION_CONFLICT; (3) comprueba que el workspace sigue
      en la `resultRevision` que dejó el apply (la revisión actual del conocimiento escribible == la
      del receipt) → WRITE_CONFLICT y NO revierte si algún fichero afectado cambió tras el apply.
      Luego delega en `Workspace::revert_transaction_con_recibo`, que bajo el lock de publicación (E13-H02)
      RE-VERIFICA esa misma revisión (E25-H05: el paso (3) mira sin el lock, y en esa ventana otro
      escritor puede tocar un `.md` afectado → WRITE_CONFLICT sin escribir nada, en vez de pisarlo con
      la copia respaldada), verifica que las copias de recuperación existen, respalda el estado actual
      de los afectados (recuperabilidad de la inversa), registra su intención en un journal `prepared`
      fsynced Y EL RECIBO DE LA INVERSA junto a él —antes del primer rename, E25-H05—, restaura por el
      único escritor (`io::write_atomic` de cada original respaldado, `io::delete` de los paths creados
      marcados `.absent`), sella promoviendo ese recibo y devuelve las revisiones. Con lo que revertir
      IMPLICA recibo igual que aplicar (E25-H04): si el proceso muere entre el último rename y el
      sellado, la vía COMPLETAR de la recuperación lo promueve. Lo que queda tras revertir —re-escribir
      el ChangeReceipt de la reversión (inversa: previous/result intercambiados) y la retención
      (`gc_receipts`)— es best-effort con aviso por stderr: corre con la reversión ya publicada, así que
      no puede convertirla en un error. El `workspaceRevision` devuelto == la `previousRevision` del
      apply revertido: el workspace vuelve al estado previo. IDENTIDAD DE LA INVERSA (E28-H01, E28-H03):
      el `receiptId` de la reversión se deriva del `receiptId` que se deshace —no del `changeSetId` que
      ese recibo hereda—, con la cadena `X` → `X-revert` → `X-revert-2` → …, y ese id derivado es un
      CANDIDATO: si ya lo ocupa una transacción con material vigente (journal o recibo), la reversión
      publica bajo la primera variante libre en vez de sobrescribir su plano de recuperación (E28-H01)
      o de fallar sin salida (E28-H03). Es la misma resolución que usa `change_apply`, y por eso el
      `receiptId` que devuelve esta tool puede no ser el que el llamante derivaría por su cuenta: el
      del retorno es el efectivo, y es el que localiza el recibo. Historial general (no-goal, no es git;
      `REFACTOR §11.3`). audit = E13-H10.

