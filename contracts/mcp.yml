      - { nombre: policy, tipo: object, requerido: false, semantica: "{ requireValidResult?, allowWarnings? } (PlanPolicy, E12-H04); por defecto exige conformidad y permite warnings. Cada campo es independientemente opcional (E29-H02, `decisiones §19(b)`): un objeto PARCIAL —una sola clave, o incluso «policy: {}»— completa el campo omitido con su default, igual que omitir «policy» entera; hasta v0.5.0 el `Deserialize` de PlanPolicy exigía las DOS claves si el objeto estaba presente y una policy parcial daba INVALID_SCHEMA «missing field …» pese a que este contrato ya declaraba los dos campos opcionales" }
    retorno: "PlanResult (lodestar_app): { changeSetId, baseWorkspaceRevision, planHash, canApply, policy, expiresAt, normalizedOperations: [NormalizedOperation], noOpOperations: [{ index, path, op }], risk, semanticDiff, impact: { affectedDocuments, affectedCount }, capturedRevisions: { «path»: «blake3:…» }, diagnosticsBefore, diagnosticsAfter } — json directo, sin envelope. `noOpOperations` (E31-H02, `decisiones §26`) lista las operaciones que se materializaron pero cuyo resultado es IDÉNTICO al documento de partida: ni error ni advertencia, es la respuesta a «ejecuté tu operación, resultado: sin efecto», que hasta v0.5.0 el plan no sabía dar —la op aparecía en normalizedOperations indistinguible de una efectiva, y la única pista, que el documento saliera en semanticDiff.modified, era ENGAÑOSA porque salía por el churn de bytes de la reserialización del frontmatter—. Es DERIVADO por comparación de bytes, el mismo predicado con el que el escritor computa su lote afectado, así que el plan no puede prometer un no-op que el apply escriba. Cubre cualquier operación sin efecto, no solo `replace_text`: también un `edit_section` que reescribe una sección con su contenido actual, un `patch_frontmatter` que escribe el valor que ya estaba o un `move` con `from == to` (un `move` real nunca es no-op aunque su destino case: el origen desaparece). `index` apunta a la posición dentro de `normalizedOperations`, que CONSERVA la operación —la señal es aditiva, no la sustituye ni la elimina—, y `op` nombra la operación YA NORMALIZADA (un `replace_text` figura como `replace_body`, porque es lo que `index` indexa). Va FUERA del planHash —que cubre baseWorkspaceRevision ‖ normalizedOperations—, así que ningún planHash cambia y un plan persistido por un binario anterior se lee con la lista vacía. `capturedRevisions` (E21-H02) lleva una entrada por documento de una selección masiva (su DocumentRevision, el snapshot de §Fase 12); vacío {} en la forma-array. `policy` (E29-H07) es la PlanPolicy efectiva con la que se computó `canApply` —la enviada, con los defaults ya aplicados—: se devuelve y se persiste con el plan porque `change_apply` la RECOMPUTA para ejercer el veredicto (`decisiones §18`), de modo que el cliente ve exactamente bajo qué política se le juzgará al aplicar"
    output_schema: "sí — schemars::schema_for!(PlanResult), vía lodestar_app::schemas::change_plan_schema()"
    errores: ["REVISION_CONFLICT (workspace o documento cambiado)", "INVALID_SCHEMA (op desconocida o parámetro inválido; un `where`/`filter` de `selection` malformado, CON el diagnóstico del parser del core en el mensaje — E26-H07; hasta v0.4.0 `build_selection_expression` lo descartaba con `map_err(|_| …)` y la misma consulta se diagnosticaba por knowledge_search y se callaba por change_plan; y un TYPE ERROR al evaluar `selection.where`/`selection.filter` — E26-H08: una selección masiva ya no salta documentos en silencio, y el error es el MISMO código y el MISMO texto que daría knowledge_search con esa consulta; desde E29-H04, y ampliado en E30-H03, los type errors del lenguaje —orden cruzado, operador de lista sobre un no-lista y operador de TEXTO sobre un no-string: `starts_with`/`ends_with` a cualquiera de los dos lados, y `contains` sobre un campo STRING con un literal no-string, donde significa subcadena— abortan igual)", "DOCUMENT_NOT_FOUND (objetivo de normalización inexistente)", "DOCUMENT_ALREADY_EXISTS (E28-H02: create sobre un path ya ocupado por un documento existente; move cuyo «to» ya está ocupado. Simétrico de DOCUMENT_NOT_FOUND —la dirección contraria— y el mensaje NOMBRA el path colisionado. Hasta v0.5.0 no había guard: el plan salía con canApply:true y el apply PISABA el documento existente sin un solo diagnóstico. Un move con from == to no es colisión: sigue siendo el no-op válido de siempre. E28-H04: el mismo código cubre las colisiones INTRA-PLAN —dos ops del mismo change set que reclaman el path— porque el guard consulta la ocupación acumulada; liberar y reocupar en el mismo plan NO es colisión)", "INBOUND_LINKS_EXIST (delete «reject» con entrantes)", "PERMISSION_DENIED (path-traversal)", "RECOVERY_FAILED (E25-H02: la recuperación transparente del paso (0) —E24-H03— no pudo restaurar una transacción interrumpida porque sus copias no verifican; su journal y sus copias quedan en .lodestar/runtime/journal/quarantine/<txnId>/ y el mensaje nombra la ruta; la SIGUIENTE llamada ya no encuentra recuperación pendiente)", "INTERNAL_IO_ERROR (carga de config)", "WorkspaceError"]
    semantica: >-
      Orquesta un plan de cambios SIN escribir (invariante #1; aplicar es change_apply, E13): toda
      la simulación es sobre un DocumentSet en memoria. Acepta DOS formas de wire: la forma-ARRAY
      («operations»: ops sueltas, E12-H08) y la forma-OBJETO de SELECCIÓN MASIVA («selection» +
      «operation», E21-H02) — la consulta E19 elige documentos y la operación se expande a una op por
      documento seleccionado, capturando su DocumentRevision en «capturedRevisions» (snapshot de
      §Fase 12); una selección que no casa nada da un plan vacío sin error, pero un TYPE ERROR al
      evaluar la consulta ABORTA el plan (INVALID_SCHEMA, E26-H08: hasta v0.4.0 el documento que
      erraba se saltaba en silencio y el plan afectaba a menos ficheros de los seleccionados). Eso
      vale para TODOS los casos de type error del lenguaje, no solo para el orden: desde E29-H04 un
      `starts_with`/`ends_with` sobre un valor que no es string también aborta, y desde E30-H03
      también un `contains` sobre un campo STRING con un literal no-string (sobre un campo LISTA
      sigue siendo pertenencia y admite literales de cualquier tipo), donde hasta v0.5.0
      recortaba la selección en silencio y presentaba el plan resultante con canApply:true. La
      consulta decide el conjunto recorriendo el ORDEN TOTAL de Analysis::documents ANTES de
      expandir ninguna operación, así que el documento nombrado en el error no depende del orden en
      que el planificador toque los documentos. Verifica
      `expectedWorkspaceRevision` (o toma la
      actual como `baseWorkspaceRevision` = workspace_revision sobre las raíces escribibles) y, por
      cada op con `expectedRevision`, la DocumentRevision (blake3 del .md) del documento objetivo →
      REVISION_CONFLICT si difiere. Normaliza TODAS las ops a un ÚNICO change set (una op de
      estructura puede producir varias NormalizedOperation, p. ej. move + N ReplaceBody), construye
      el workspace hipotético (plan::apply_normalized_ops) y deriva semanticDiff (E12-H03), risk
      (E12-H02) y validación antes/después (E12-H04); `canApply` = can_apply(report, policy).
      `canApply` VINCULA al apply desde E29-H07 (`decisiones §18`): no es un consejo que el cliente
      pueda ignorar insistiendo, sino el veredicto que `change_apply` RECOMPUTA —con la `policy` que
      se persiste junto al plan— y con el que rechaza (INVALID_RESULT, antes del lock y sin escribir)
      un plan que salió `canApply:false`. Aplicar un plan no aplicable exige replanificar, o
      planificar con una `policy` que admita el resultado; hasta v0.5.0 el mismo `changeSetId` se
      publicaba igual y `canApply` era una afirmación que el motor no respaldaba.
      `planHash` DETERMINISTA = blake3(baseWorkspaceRevision ‖ serialización JSON canónica de las
      normalizedOperations) — mismo input+base ⇒ mismo hash, input distinto ⇒ hash distinto; NO
      depende del reloj (`expiresAt` sí es wall-clock pero queda fuera del hash). `changeSetId` se
      deriva del planHash. Persistir el plan es E12-H09.
      UNA OPERACIÓN SIN EFECTO SE DECLARA, NO DESAPARECE (E31-H02, `decisiones §26`): si al
      materializarla el documento queda idéntico —un `replace_text` cuyo `find` no casa, un
      `edit_section` con el contenido que ya estaba, un `move` con `from == to`—, la operación sigue
      en `normalizedOperations` Y se anota en `noOpOperations`. No se elimina del plan: borrarla
      dejaría al cliente sin poder distinguir «la ejecuté y no hizo nada» de «nunca la mandaste».
      Y ya no toca el disco: la ESCRITURA preserva la cabecera del documento byte a byte
      (`model::replace_body_preservando_cabecera`), así que un no-op no cambia ni un byte, no mueve
      `workspaceRevision` y no aparece en `semanticDiff.modified`. Hasta v0.5.0 sí lo hacía: toda
      reescritura de cuerpo reconstruía el documento entero y RESERIALIZABA su frontmatter, de modo
      que un bloque en estilo flow (`tags: [a, b]`) volvía en estilo bloque. Eso afectaba a TODA
      operación que reescribiera cuerpo —`replace_text`, `edit_section`, `replace_body`,
      `delete remove_links` y `move`, incluido el `rewriteInboundLinks` que reescribe el cuerpo de
      CADA enlazante—, normalizaba el separador inyectando una línea en blanco, y borraba el
      frontmatter ILEGIBLE (pérdida de datos: el bloque cuyo YAML no se deja leer desaparecía al
      reescribir el cuerpo).

  - nombre: change_apply
    fuente: crates/lodestar-mcp/src/tools.rs
    historia: E13-H08
    perfil: standard
    params:
      - { nombre: changeSetId, tipo: string, requerido: true, semantica: "el «changeset:<hash>» que devolvió change_plan (E12-H08); el plan se recupera de `.lodestar/runtime/plans/` por este id (E12-H09)" }
      - { nombre: expectedWorkspaceRevision, tipo: string, requerido: false, semantica: "control optimista a nivel de workspace («blake3:…»); si se omite se adopta la revisión actual, si no coincide → REVISION_CONFLICT" }
    retorno: "ApplyResult (lodestar_app): { receiptId, applied, previousWorkspaceRevision, workspaceRevision, changedPaths, semanticDiff, validation: { valid, errors, warnings } } — json directo, sin envelope"
    output_schema: "sí — schemars::schema_for!(ApplyResult), vía lodestar_app::schemas::change_apply_schema()"
    errores: ["INVALID_SCHEMA (parámetro no declarado — E29-H08; p. ej. el typo «changeSetID» por «changeSetId», que hasta v0.5.0 se descartaba y salía como «falta el parámetro obligatorio changeSetId», sin pista de que sí se había mandado escrito de otra forma)", "PLAN_EXPIRED (plan caducado)", "PLAN_STALE (plan ausente/ilegible, o el workspace cambió bajo él ⇒ planHash recomputado difiere)", "REVISION_CONFLICT (expectedWorkspaceRevision no coincide, o la base cambió entre plan y apply)", "WRITE_CONFLICT (TRES emisores, los tres ANTES del primer rename y sin escribir nada en el canónico: (1) el lock de publicación ya lo tiene otro publicador VIVO — `Workspace::acquire_lock`, E13-H02; un lock huérfano se reclama y no da error, E23-H23/E25-H06; (2) la base del plan cambió entre el plan y el apply, RE-VERIFICADA bajo el lock — `reverify_base_revision`, E13-H02; (3) el conocimiento canónico cambió dentro de la ventana `[T1, T3)`, entre el cálculo del lote y su publicación: otro proceso, el usuario, o un `.md` aparecido bajo un `referenceRoot` que el control optimista no puede ver porque `workspace_revision` excluye lo que queda fuera de `writableRoots`. Ese tercer caso lo detecta `publish_result` comparando el canónico de T1 con el de T3 (E25-H01) y el aborto SELLA su propia transacción bajo el mismo lock (E25-H02), así que no deja recuperación pendiente que la siguiente llamada pudiera aplicar encima de la edición externa. El mensaje NOMBRA los paths divergentes. Es terminal para esa transacción: el agente replanifica sobre el conocimiento actual. Este contrato no lo listaba hasta E26-H11 —incoherencia interna anotada por el juez ciego de E25-H01— pese a que `change_revert` sí lo declara y la `semantica` de abajo ya narraba el aborto)", "PERMISSION_DENIED (un path afectado cae fuera de writableRoots / bajo un referenceRoot)", "INVALID_RESULT (DOS emisores, ambos ANTES del primer rename y sin escribir nada; comparten código porque comparten predicado —«el resultado simulado no supera la política vigente»— y remedio —replanificar o relajar la política—, y se distinguen POR EL MENSAJE, que nombra las cláusulas de SU política y nunca las de la otra: (1) VEREDICTO DEL PLAN (E29-H07, `decisiones §18`): el plan tenía `canApply:false` bajo la `PlanPolicy` con la que se planificó —persistida con él— y el apply lo RECOMPUTA con `core::plan::can_apply` (invariante #3) ANTES de tomar el lock, o sea antes de que WRITE_CONFLICT/PERMISSION_DENIED puedan aparecer y sin staging, journal, recibo ni copias de recuperación; el mensaje NOMBRA la cláusula que bloqueó —`requireValidResult` (resultado no válido) y/o `allowWarnings` (resultado válido pero con warnings)—. Hasta v0.5.0 `canApply` viajaba al cliente y NADIE lo ejercía: el plan se publicaba igual si el agente insistía. Un plan persistido por un binario anterior a E29-H07 no lleva la policy y se juzga con `PlanPolicy::default()`, la más estricta. (2) GATE DIFERENCIAL DE STAGING (E20-H04, dentro de la transacción y con la política `transactions`, que es OTRA): el resultado INTRODUCE errores que el canónico no tenía con rejectNewErrors, o deja errores con allowExistingErrors:false; su mensaje habla de `rejectNewErrors`/`allowExistingErrors`. El (1) juzga la policy del PLAN y muerde con errores PREEXISTENTES o con warnings —casos en los que el (2) no tiene nada que objetar—; el (2) juzga los errores NUEVOS que el (1) no mira)", "WORKSPACE_RECOVERY_REQUIRED (recuperación pendiente no completada)", "DOCUMENT_ALREADY_EXISTS (E28-H04, reserva: el plan PERSISTIDO que se aplica contiene una colisión INTRA-PLAN —dos de sus `normalizedOperations` reclaman el mismo path, p. ej. `[move a→final, move b→final]`—. El plan es un artefacto durable con TTL propio, así que el guard de `change_plan` no basta: un plan escrito por un binario anterior a E28-H04, o por cualquier vía futura que normalizara sin acumular ocupación, publicaba y el primer destino desaparecía en silencio. Se juzga con la MISMA función del core que usa `change_plan` (`plan::assert_sin_colisiones_intra_plan`, invariante #3) y ANTES del primer rename: el mensaje NOMBRA el path colisionado y el disco queda intacto)", "RECOVERY_FAILED (E25-H02: una transacción interrumpida no se pudo restaurar porque sus copias no verifican; su journal y sus copias quedan en .lodestar/runtime/journal/quarantine/<txnId>/ y el mensaje nombra la ruta; la SIGUIENTE llamada ya no encuentra recuperación pendiente)", "INTERNAL_IO_ERROR (carga de config, IO de la transacción)", "WorkspaceError"]
    semantica: >-
      Aplica un plan vigente por el ÚNICO ESCRITOR (invariante #5) con la mecánica de publicación
      recuperable de E13 (invariante «nunca un estado parcial silencioso»). Pasos de plan: carga el
      plan persistido (PLAN_EXPIRED si caducó, PLAN_STALE si no existe) → verifica
      `expectedWorkspaceRevision` si viene → RE-VERIFICA el `planHash` recomputándolo sobre la base
      ACTUAL del workspace (`blake3(revisiónActual ‖ normalizedOperations)`, la misma función que
      change_plan); si difiere del persistido, el workspace cambió bajo el plan ⇒ PLAN_STALE y NO
      escribe. → EL VEREDICTO DEL PLAN VINCULA (E29-H07, `decisiones §18`): con la base ya
      verificada, RECOMPUTA `canApply` = can_apply(validate_result(resultado hipotético), policy DEL
      PLAN) con la misma función del core que usó change_plan (invariante #3, sobre la `PlanPolicy`
      que ahora se persiste en el PlanResult); si es `false` ⇒ INVALID_RESULT nombrando la cláusula
      que bloqueó (`requireValidResult`/`allowWarnings`) y NO escribe. Este gate ocurre ANTES de
      tomar el lock y de tocar staging —es un veredicto sobre el PLAN, no sobre el disco—, así que un
      plan rechazado por él no deja journal, ni staging, ni recibo, ni copias de recuperación (sí
      queda su plan persistido, que caduca por TTL, y su línea en audit.jsonl, que registra TODO
      intento). Hasta v0.5.0 no existía: `canApply` se publicaba y no se ejercía, y el único filtro
      que quedaba era el gate de staging de abajo, con OTRA política. Luego delega en
      `Workspace::apply_transaction`, que ejecuta EN ORDEN: lock de
      publicación (E13-H02) → cálculo del conjunto afectado real (creados/modificados/borrados) →
      `assert_writable` de cada afectado ANTES de tocar el canónico (E11-H04 → PERMISSION_DENIED) →
      staging + gate diferencial de cambios (E13-H01/E20-H04: rechaza con INVALID_RESULT solo
      si el resultado introduce errores que el canónico no tenía, según rejectNewErrors/
      allowExistingErrors) → re-verificación de la base (E13-H02) → copias de recuperación
      (E13-H04) → write-ahead journal `prepared` fsynced (E13-H03) → REGISTRO DURABLE DEL RECIBO, con
      el journal y ANTES del primer rename (E25-H04) → renames atómicos por el único escritor
      (E13-H05) → sellado (promueve ese registro a ChangeReceipt definitivo ANTES de borrar el journal,
      limpia staging/journal y CONSERVA las copias de recuperación).
      El `receiptId` es el `txnId` con el que la transacción publicó (E13-H07). El CANDIDATO es el id
      derivado del changeSetId, pero desde E28-H03 la identidad se RESUELVE bajo el lock: como el
      changeSetId es determinista, replanificar el mismo cambio sobre la misma base vuelve a producirlo,
      y publicar bajo un id que ya identifica a una transacción con material vigente (journal o recibo)
      borraba en silencio sus copias de recuperación. Hoy se publica bajo la primera variante libre, así
      que dos applies del mismo changeSetId devuelven receiptIds DISTINTOS y ninguno pisa al otro; el
      receiptId del retorno es el único que localiza el recibo (derivarlo por fuera no es fiable).
      Ningún código de error nuevo: el defecto no fallaba, sobrescribía. Tras el sellado la
      fachada re-escribe el recibo y ejecuta la retención (`gc_receipts`). El `workspaceRevision`
      devuelto es la revisión resultante: el workspace «queda en» ella. revert = change_revert (E13-H09).
      E25-H04 — PUBLICAR IMPLICA RECIBO: el orden importa y es contrato. El recibo se persiste ANTES
      del punto de no retorno porque sus dos revisiones ya se conocen ahí, de modo que ni un fallo
      posterior ni un SIGKILL pueden dejar un cambio publicado sin forma de deshacerlo (antes eso
      hacía a la transacción irreversible PARA SIEMPRE: change_revert → PLAN_EXPIRED por recibo
      ausente, y un segundo change_apply del mismo plan → PLAN_STALE porque la base ya había
      cambiado). Corolarios observables: (a) NINGÚN paso posterior a la publicación puede devolver
      error — sellado, limpieza de staging, retención y el propio cálculo de `validation` son
      best-effort con aviso por stderr—, así que un apply que publicó responde SIEMPRE éxito; (b) si
      el proceso muere entre el último rename y el sellado, al reabrir la recuperación toma la vía
      COMPLETAR, da por bueno ese registro y CONSERVA las copias, así que la transacción sigue siendo
      reversible; (c) una transacción que NO llega a publicar no deja recibo (el aborto de ventana y
      la vía RESTAURAR retiran el registro), así que change_revert sobre ella sigue siendo
      PLAN_EXPIRED; (d) `validation.valid` es `false` también cuando la conformidad post-apply no se
      pudo computar —caso distinguible por `errors == 0 && warnings == 0 && valid == false`, imposible
      en un veredicto realmente computado—, sin que eso convierta el apply en un fallo.
      La auto-regen de index/tags dentro de la transacción (E13-H11) se RETIRÓ en E15-H02: el
      apply publica EXACTAMENTE el resultado del change set, sin añadir índices ni tags.
      E25-H02: las copias de recuperación se escriben con el protocolo DURABLE del único escritor
      (contenido volcado + fsync del árbol antes del journal) y llevan la huella (tamaño + blake3) con
      la que la recuperación las verifica antes de restaurar. Y si la publicación aborta con
      WRITE_CONFLICT por divergencia de la ventana `[T1, T3)` (E25-H01), ese aborto **sella su propia
      transacción** bajo el mismo lock —journal primero, copias después—: con cero renames no hay nada
      que restaurar, así que no deja recuperación pendiente que la siguiente llamada pudiera aplicar
      encima de la edición externa.

