[package]
name = "lodestar-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Servicios de caso de uso finos sobre Workspace: envelope de protocolo y códigos de error."
keywords = ["okf", "knowledge-base", "local-first", "services", "markdown"]
categories = ["development-tools"]

[dependencies]
# Activa `JsonSchema` en los tipos de `core::types`/`core::schema` que embeben las respuestas de
# las tools de lectura (outputSchema, E10-H13, decisión D6b) — el core los lleva ya preparados
# detrás de esta feature (`schema_derive!` en `types.rs`), sin traer rusqlite/git2/tokio.
lodestar-core = { workspace = true, features = ["schemars"] }
lodestar-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
blake3 = { workspace = true }
schemars = { workspace = true }

[features]
default = []
# Passthrough del arnés de fallo/gancho de `lodestar-workspace` (E25-H01). No cablea nada en
# producción: solo permite que los tests de esta fachada armen los seams del orquestador
# transaccional (p. ej. inyectar una edición externa en la ventana `[T1, T3)` de la publicación) y
# comprueben que el error resultante llega al wire con su `ErrorCode`.
test-failpoints = ["lodestar-workspace/test-failpoints"]

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
# E33-H01: el generador de escala compartido (`ARCHITECTURE.md §22.2`) vive en el crate de fixtures
# —nunca en el core (invariante #2) ni inline en un test—, y los arneses de escala de esta fachada
# (`escala.rs`, `corpus_realista.rs`) lo consumen desde ahí.
lodestar-fixtures = { workspace = true }
# Los tests de `plan.rs` que forjan un plan PERSISTIDO (E28-H03/H04, adenda) tienen que recomputar
# el `planHash` exactamente como lo hace `compute_plan_hash` — `blake3(baseRevision ‖ 0x00 ‖ JSON de
# las normalizedOperations)`— o el gate de `change_apply` los rechazaría con `PLAN_STALE` y el test
# pasaría por la razón equivocada. Es la misma dependencia (y la misma versión del workspace) que
# usa el crate, no un segundo criterio de hash.
blake3 = { workspace = true }
