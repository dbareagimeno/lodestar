[package]
name = "lodestar-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.88"
description = "Fachada de agentes (MCP/stdio) sobre Workspace. Semántica, no CRUD."
keywords = ["okf", "mcp", "knowledge-base", "agents", "markdown"]
categories = ["development-tools"]

[[bin]]
name = "lodestar-mcp"
path = "src/main.rs"

[dependencies]
lodestar-core = { workspace = true }
lodestar-workspace = { workspace = true }
lodestar-app = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-io", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.24.0"
# E24-H15: valida que el `structuredContent` que emite cada tool CONFORMA el `outputSchema` que
# declara. Es lo que hace un cliente MCP estricto, y hasta ahora nada lo comprobaba: el test
# existente solo miraba 5 de las 10 tools y solo que el schema «tuviera alguna clave estructural».
jsonschema = "0.49"

# E24-H14: `SIGKILL` al binario para probar el crash REAL (ni un `Drop` se ejecuta). Solo tests, y
# solo Unix: Windows no tiene equivalente con la misma garantía.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
