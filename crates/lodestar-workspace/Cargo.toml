[package]
name = "lodestar-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Glue: compone core + store. Handle unificado, único escritor y bus de eventos."
keywords = ["okf", "knowledge-base", "local-first", "watcher", "markdown"]
categories = ["filesystem", "development-tools"]

[dependencies]
lodestar-core = { workspace = true }
lodestar-discovery = { workspace = true }
lodestar-store = { workspace = true }
thiserror = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = "0.5"

# E23-H23: comprobar si el dueño de un lock huérfano sigue vivo (`kill(pid, 0)`). Solo en Unix; en
# Windows el TTL hace de red. No añade código externo nuevo al árbol: `libc` ya llega
# transitivamente por `rusqlite`/`notify`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# (E23-H12 retiró la feature `schemars`: gateaba `#[derive(JsonSchema)]` en `ExternalReference`, el
# único tipo de wire que este crate exportaba, y ese tipo desapareció con las claves de frontmatter
# privilegiadas. La workspace ya no aporta tipos al `outputSchema` de ninguna tool.)
# Arnés de crash-recovery (E13-H06): habilita la sonda de fallo (`FailPoint`) y la batería de tests
# de recuperación determinista de `tests/transactions.rs`. Solo test/plumbing — NO cablea lógica de
# recovery en producción. La sonda de fallo de PRODUCCIÓN que el implementador thread-eará por el
# orquestador transaccional también vivirá tras esta feature (contrato documentado en los tests).
test-failpoints = []
# E29-H10 (`decisiones §16(g)`): reabre como `pub` la API de escritura NO transaccional de
# `Workspace` (`create_document`/`write_document`/`merge_frontmatter`/`publish`), que en una build
# normal es `pub(crate)` — nadie fuera de este crate debe escribir el canónico esquivando el
# journal/lock/backup del camino transaccional. Los tests de integración
# (`tests/workspace.rs`, `tests/transactions.rs`) la necesitan como primitiva de fixtures y, en
# algunos casos, como sujeto directo de prueba del camino no transaccional en sí. Se activa siempre
# para el harness de tests de ESTE crate vía el auto-dev-dependency de abajo — no hace falta pasar
# `--features test-support` a mano ni en CI, y ningún consumidor externo (`lodestar-app`/`cli`/
# `mcp`) la activa jamás porque no la piden.
test-support = []

[lints]
workspace = true

[dev-dependencies]
# Workspaces de prueba compartidos (E15-H05): `arbitrary`, `with_edge_cases`, `materialize` y
# `materialize_disk_only`, consumidos por `tests/discovery.rs` (E15-H07).
lodestar-fixtures = { workspace = true }
tempfile = "=3.24.0"
serde_yaml = { workspace = true }
# Solo para fabricar a mano una cache con esquema viejo en el test de regresión e2e.
rusqlite = { version = "0.32", features = ["bundled"] }
# Auto-dev-dependency (E29-H10): activa `test-support` SOLO para compilar/ejecutar los tests de
# integración de este crate (`tests/*.rs`), sin que `default` la arrastre para quien depende de
# `lodestar-workspace` como librería. Es el mismo truco que hace que `cargo test -p
# lodestar-workspace` no necesite `--features test-support` explícito en la línea de comandos.
lodestar-workspace = { path = ".", features = ["test-support"] }
