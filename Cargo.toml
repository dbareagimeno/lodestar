[workspace]
resolver = "2"
members = [
  "crates/lodestar-core",
  "crates/lodestar-store",
  "crates/lodestar-workspace",
  "crates/lodestar-app",
  "crates/lodestar-cli",
  "crates/lodestar-mcp",
  "crates/lodestar-fixtures",
  "crates/lodestar-bench",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbareagimeno/lodestar"
homepage = "https://github.com/dbareagimeno/lodestar"
readme = "README.md"
rust-version = "1.80"

[workspace.dependencies]
# Núcleo (puro): serialización y utilidades sin I/O
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "=1.8.2"
thiserror = "1"
once_cell = "1"
regex = "1"
unicode-normalization = "0.1"
# Parser CommonMark del core (E17): puro, sin I/O ni runtime. `html` se activa por feature.
pulldown-cmark = { version = "0.12", default-features = false }
schemars = "0.8"
# Crates internos. Los publicables llevan `version` junto al `path`: cargo usa el `path`
# en el workspace y sustituye por la `version` (crates.io) al publicar.
lodestar-core = { path = "crates/lodestar-core", version = "0.6.2" }
lodestar-store = { path = "crates/lodestar-store", version = "0.6.2" }
lodestar-workspace = { path = "crates/lodestar-workspace", version = "0.6.2" }
lodestar-app = { path = "crates/lodestar-app", version = "0.6.2" }
# Solo-dev y `publish = false`: sin `version` para que cargo la descarte al empaquetar.
lodestar-fixtures = { path = "crates/lodestar-fixtures" }
# Fachadas / infra
clap = { version = "=4.5.61", features = ["derive"] }
anyhow = "1"
ignore = "=0.4.23"

# Cargo no aplica el MSRV declarado por las crates del workspace a sus transitivas. Esta tabla es
# política mecanizable: Cargo.lock materializa el pin y agent-gates impide que una actualización de
# serde_yaml arrastre indexmap >=2.12 (MSRV 1.82) al workspace que conserva Rust 1.80.
[workspace.metadata.msrv-pins]
indexmap = "=2.11.4"
clap_lex = "=1.0.1"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
