name: Cleanup publish v0.6.2

on:
  push:
    branches:
      - agent/publish-v062

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina la rama temporal de publicación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin --delete agent/publish-v062
