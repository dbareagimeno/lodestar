name: CI

# Gate de calidad: ninguna rama puede mergearse a `develop` (ni de ahí a `main`) sin
# pasar TODOS estos jobs.
# La protección de rama de `develop` y `main` exige que pasen estos checks (ojo: el
# nombre del check es el `name:` del job, no su id, y la matriz lo expande por SO):
#   Rust · fmt · clippy · build · test (ubuntu-latest | macos-14 | windows-latest)
#   MSRV · workspace sin MCP (Rust 1.80.1)
#   MSRV · fachada MCP (Rust 1.88.0)
#   Core puro + gate completo (sin tokio/rusqlite/git2/notify/tauri/zip)
#   Smoke de la demo (examples/demo)
# Si renombras un job, actualiza también la lista de checks obligatorios en GitHub o
# la protección quedará exigiendo un check que ya no existe (y bloqueará todo merge).
#
# `develop` es la rama de integración y la rama por defecto del repo; `main` solo recibe
# releases desde `develop` (ver RELEASING.md). Por eso el push dispara en las dos.

on:
  push:
    branches: [develop, main]
  pull_request:

# Cancela runs antiguos de la misma rama/PR para no malgastar minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust: formato + lint estricto + compila TODO + tests. Si algo no compila, falla.
  #
  # Corre en las TRES plataformas objetivo del producto (macOS Apple Silicon,
  # Windows y Linux). Esto ~triplica los minutos de CI del job de Rust, pero
  # lodestar es un motor headless multiplataforma: el watcher `notify` y el I/O
  # de ficheros tienen rutas de código dependientes del SO, así que hay que
  # compilarlos y testearlos en cada una. `fail-fast: false` para ver TODAS las
  # plataformas que fallan, no solo la primera.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust · fmt · clippy · build · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instala toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      # E15-H04: el CI ya NO instala node. El arnés diferencial JS-vs-Rust se retiró con el
      # prototipo como spec de comportamiento (la spec es ahora `docs/REFACTOR_PHASE_2.md` +
      # `ARCHITECTURE.md §20`); `prototype/` se conserva como referencia histórica de v0.2.x,
      # sin ejecutarse.

      - name: Formato (falla si no está formateado)
        run: cargo fmt --all --check

      - name: Clippy (warnings = error, todos los targets y features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # `--all-targets` compila también tests, benches y ejemplos: garantiza que NADA que
      # no compile entre en la rama, no solo el código de producción.
      - name: Build (todo el workspace, todos los targets)
        run: cargo build --workspace --all-targets --locked

      # Los clientes oficiales H03/H06 son crates auxiliares aislados que ejecutan Cargo offline,
      # para demostrar que no heredan por accidente los features del servidor. Este paso obtiene
      # su dependencia exacta sin incorporarla al grafo de producción/tests de lodestar-mcp y
      # comunica la ruta portable a ambos harnesses.
      - name: Localiza tokio-stream para clientes rmcp oficiales
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $probe = Join-Path $env:RUNNER_TEMP "e34-tokio-stream-source"
          New-Item -ItemType Directory -Force $probe | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $probe "src") | Out-Null
          New-Item -ItemType File -Force (Join-Path $probe "src/lib.rs") | Out-Null
          @'
          [package]
          name = "e34-tokio-stream-source"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          tokio-stream = "=0.1.17"
          '@ | Set-Content -Path (Join-Path $probe "Cargo.toml") -Encoding utf8
          cargo fetch --manifest-path (Join-Path $probe "Cargo.toml")
          $source = Get-ChildItem (Join-Path $cargoHome "registry/src") -Directory -Recurse -Filter "tokio-stream-0.1.17" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $source) { throw "falta tokio-stream 0.1.17 en el cache de Cargo" }
          "E34_TOKIO_STREAM_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Tests
        run: cargo test --workspace --locked

      # E33-H05: smoke del banco; los runners compartidos nunca juzgan umbrales absolutos.
      - name: Smoke del banco de rendimiento (sin gate absoluto)
        run: cargo run -p lodestar-bench -- --smoke

      # E23-H06: los 4 tests de crash-recovery de E13-H06 viven tras `#[cfg(feature =
      # "test-failpoints")]` (`crates/lodestar-workspace/tests/transactions.rs`), así que el paso de
      # arriba NO los ejecuta: `cargo test --workspace` no activa features opcionales. Se quedaron
      # fuera de la puerta desde E13 hasta que la revisión de la PR #17 lo destapó.
      #
      # Importa porque son la garantía NUCLEAR del producto: `recovery_sin_parciales` es —por
      # declaración del propio `benchmark.rs`— la prueba autoritativa de que un crash a mitad de la
      # publicación nunca deja un `.md` a medias, y `recovery_bloquea_escritura` es el único test del
      # repo que asevera `WORKSPACE_RECOVERY_REQUIRED`. Sin este step, clippy los compila (por
      # `--all-features`) pero nadie los ejecuta: no se pudren, pero tampoco muerden.
      #
      # E25-H01 añadió el mismo gate a `lodestar-app`: la fachada propaga la feature
      # (`test-failpoints = ["lodestar-workspace/test-failpoints"]`) para poder armar los seams del
      # orquestador desde `App::change_apply` y comprobar que el error llega al wire con su
      # `ErrorCode` (`crates/lodestar-app/tests/escritura.rs`, módulo `ventana_de_publicacion`).
      - name: Tests de crash-recovery (feature `test-failpoints`)
        run: |
          cargo test -p lodestar-workspace --features test-failpoints --locked
          cargo test -p lodestar-app --features test-failpoints --locked

      - name: Doc (los doc-comments deben compilar; intra-doc links rotos = error)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # E34-H01: rmcp eleva únicamente la fachada MCP. Estos dos checks impiden que
  # una actualización transitiva eleve en silencio el resto del workspace o que
  # lodestar-mcp deje de compilar con el MSRV ratificado para la fachada.
  msrv-workspace:
    name: MSRV · workspace sin MCP (Rust 1.80.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.1
      - uses: Swatinem/rust-cache@v2
      - name: Compila el workspace conservado en Rust 1.80
        run: cargo check --workspace --exclude lodestar-mcp --locked

  msrv-mcp:
    name: MSRV · fachada MCP (Rust 1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Compila exclusivamente la fachada MCP
        run: cargo check -p lodestar-mcp --locked

  # ---------------------------------------------------------------------------
  # Invariante #2 (ARCHITECTURE.md §2.2, §10 fila 2, E8-H11): el core es PURO.
  # El gate compartido comprueba además dependencias retiradas, fuente única de códigos,
  # coherencia estructural MCP y que la guidance de agentes no haya reintroducido reglas obsoletas.
  # ---------------------------------------------------------------------------
  core-purity:
    name: Core puro (sin tokio/rusqlite/git2/notify/tauri/zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Descarga el grafo bloqueado antes de los gates
        run: cargo fetch --locked
      - name: Prepara tokio-stream para los clientes rmcp oficiales
        shell: bash
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/e34-tokio-stream-source"
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          mkdir -p "$probe/src"
          printf '%s\n' \
            '[package]' \
            'name = "e34-tokio-stream-source"' \
            'version = "0.0.0"' \
            'edition = "2021"' \
            '' \
            '[dependencies]' \
            'tokio-stream = "=0.1.17"' > "$probe/Cargo.toml"
          : > "$probe/src/lib.rs"
          cargo fetch --manifest-path "$probe/Cargo.toml"
          source="$(find "$cargo_home/registry/src" -mindepth 2 -maxdepth 2 -type d \
            -name 'tokio-stream-0.1.17' -print -quit)"
          test -n "$source"
          echo "E34_TOKIO_STREAM_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Gate completo de arquitectura, contrato y entrega
        run: ./scripts/agent-gates.sh full

  # ---------------------------------------------------------------------------
  # E27-H04: el guion de examples/demo no puede pudrirse en silencio. El job
  # ejecuta scripts/demo-smoke.sh, que mecaniza exactamente lo que
  # examples/demo/README.md documenta (check con el enlace roto deliberado,
  # la sesión MCP search→isolated→impact→plan→apply→revert y el árbol
  # intacto tras el revert). Solo en Linux: el guion es agnóstico de
  # plataforma y el job `rust` ya cubre las tres.
  # ---------------------------------------------------------------------------
  demo-smoke:
    name: Smoke de la demo (examples/demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compila CLI y MCP
        run: cargo build --locked -p lodestar-cli -p lodestar-mcp
      - name: Ejecuta el guion de la demo
        run: ./scripts/demo-smoke.sh
